# GitHub switches off a public repository's scheduled workflows after 60 days without
# activity. Enabling the check again through the API resets that clock, once a month.
name: keepalive
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ready.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
